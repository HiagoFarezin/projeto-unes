    <h3>Mais sobre tabelas</h3>
    <!--
    caption = legenda / titúlo da tabela
    theader = cabeçalho da tabela
    tbody = corpo da tabela
    tfoot = rodapé da tabela
     -->

     <table border="1"> <!--tabela-->
    <caption>Listagem de produtos</caption> <!--descrissão da tabela-->

        <thead> <!--thead = table header (cabeçalho da tabela)-->
            <tr> <!--tr = table row (linha da tabela)-->
                <th>Produto</th> <!--th = table header (cabeçalho da tabela)-->
                <th>Quantidade</th> <!--th = table header (cabeçalho da tabela)-->
                <th>Preço</th> <!--th = table header (cabeçalho da tabela)-->
            </tr>
        </thead> <!--cabeçalho da tabela-->

        <tbody> <!--corpo da tabela-->
             <tr> <!--linha da tabela-->
           <td>m4a1-s</td>
           <td>01</td>
           <td>R$400,00</td>
        </tr> 

        <tr> <!--linha da tabela-->
           <td>Adereços</td>
           <td>Acessórios</td>
           <td>Cosmeticos</td>
        </tr> 
        </tbody>

       <tfoot></tfoot>
     </table>
